<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BCC Admin</title>
<style>
  :root{--bg:#eef0f3;--surface:#fff;--surface2:#f7f8fa;--ink:#121820;--muted:#5c6675;--line:#e0e4ea;--accent:#0e7c74;--accent-weak:#e2f1ef;--good:#1f7a43;--bad:#c02626;--warn:#b45309}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c222b;--ink:#e8ebef;--muted:#9aa4b2;--line:#262d38;--accent:#2dd4bf;--accent-weak:#13302d;--good:#34d399;--bad:#f87171;--warn:#f59e0b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .hidden{display:none!important}
  button,input,select{font:inherit}
  input,select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme:dark){.btn.primary{color:#0d1117}}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.sm{padding:4px 10px;font-size:.76rem;border-radius:7px;font-weight:600}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px;box-shadow:0 8px 28px rgba(0,0,0,.07)}
  .card h1{margin:0 0 4px;font-size:1.4rem}
  .card p{margin:0 0 20px;color:var(--muted)}
  .card label{display:block;font-size:.85rem;font-weight:500;margin:14px 0 6px}
  .card input{width:100%}
  .err{color:var(--bad);font-size:.88rem;margin-top:12px;min-height:1.2em}

  /* app */
  header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{font-size:1.05rem}
  header .sp{flex:1}
  main{max-width:1420px;margin:0 auto;padding:20px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{display:block;font-size:1.6rem;letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:.82rem}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tools input{flex:1;min-width:180px}
  .tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:880px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13.5px}
  th{background:var(--surface2);font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--surface2)}
  tr:last-child td{border-bottom:0}
  th:last-child,tr.row td:last-child{position:sticky;right:0;background:var(--surface);text-align:center;padding:6px 12px;box-shadow:-3px 0 8px rgba(0,0,0,.08)}
  th:last-child{background:var(--surface2)}
  tr.row:hover td:last-child{background:var(--surface2)}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--accent-weak);color:var(--accent)}
  .pass{color:var(--good);font-weight:600}.fail{color:var(--bad);font-weight:600}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .detail td{background:var(--surface2);white-space:normal;padding:16px 20px}
  .ans{display:grid;gap:6px;margin-top:8px}
  .a{display:flex;gap:10px;font-size:.88rem}
  .a i{font-style:normal;font-weight:700;flex:0 0 1.4em}
  .a .ok{color:var(--good)}.a .no{color:var(--bad)}
  .a small{color:var(--muted)}
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <h1>BCC Admin</h1>
    <p>Sign in to view submissions.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" id="loginBtn">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <b>BCC Submissions</b>
    <span class="sp"></span>
    <button class="btn primary" id="sendAllBtn">Send Results to All (0)</button>
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn" id="csvBtn">Export CSV</button>
    <button class="btn" id="logoutBtn">Sign out</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search name, email or ID…">
      <select id="testFilter">
        <option value="">All tests</option>
        <option value="aptitude">Aptitude</option>
        <option value="bluecascade">BlueCascade</option>
        <option value="games">Games</option>
      </select>
      <select id="passFilter">
        <option value="">Any result</option>
        <option value="pass">Passed</option>
        <option value="fail">Not passed</option>
        <option value="flagged">Flagged</option>
      </select>
    </div>
    <div class="tablewrap"><table>
      <thead><tr>
        <th data-k="created_at">Date</th><th data-k="candidate_name">Name</th><th data-k="candidate_email">Email</th>
        <th data-k="test">Test</th><th data-k="score">Score</th><th data-k="passed">Result</th>
        <th data-k="tab_switches" title="Tab switches">Switches</th><th data-k="duration_sec">Time</th>
        <th>Send Result</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>

    <h3 style="margin:30px 0 10px">Blocked emails</h3>
    <div class="tablewrap"><table style="min-width:480px"><tbody id="blockedRows"></tbody></table></div>
  </main>
</div>

<script>
"use strict";
const SUPABASE_URL = "https://bjwyunkxrgqcmtuyywvh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqd3l1bmt4cmdxY210dXl5d3ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MjQ2MTQsImV4cCI6MjEwNzEwMDYxNH0.ww00QTg5hqE0kVnqcq-cs8w3vKf2GImb6_8ymzDYtDo";
const TOKEN_KEY = "bcc_admin_token";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = null, data = [], sortKey = "created_at", sortDir = -1, open = null;

try{ token = sessionStorage.getItem(TOKEN_KEY); }catch(e){}

function fmtDur(s){ if(s==null) return "—"; return Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s"; }
function fmtDate(d){ return new Date(d).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}); }

/* ---------- auth ---------- */
async function signIn(email, password){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:"POST",
    headers:{apikey:SUPABASE_KEY, "Content-Type":"application/json"},
    body:JSON.stringify({email, password})
  });
  if(!r.ok) throw new Error("Invalid email or password.");
  return (await r.json()).access_token;
}
function signOut(){
  token = null; data = [];
  try{ sessionStorage.removeItem(TOKEN_KEY); }catch(e){}
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("pw").value = "";
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try{
    token = await signIn($("email").value.trim(), $("pw").value);
    try{ sessionStorage.setItem(TOKEN_KEY, token); }catch(e){}
    await showApp();
  }catch(err){ $("loginErr").textContent = err.message; }
  $("loginBtn").disabled = false;
});
$("logoutBtn").onclick = signOut;

/* ---------- data ---------- */
async function load(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.desc&limit=1000`, {
    headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${token}`}
  });
  if(r.status===401 || r.status===403){ signOut(); $("loginErr").textContent = "Session expired. Sign in again."; return; }
  if(!r.ok){ $("rows").innerHTML = `<tr><td colspan="8" class="empty">Could not load data (${r.status}).</td></tr>`; return; }
  data = await r.json();
  render();
  loadBlocked();
}

/* ---------- blocked emails ---------- */
async function loadBlocked(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/blocked_emails?select=*&order=created_at.desc`, {
    headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${token}`}
  });
  const el = $("blockedRows");
  if(!r.ok){ el.innerHTML = `<tr><td class="empty">Could not load blocked emails (${r.status}). Run the blocked_emails SQL.</td></tr>`; return; }
  const list = await r.json();
  el.innerHTML = list.length ? list.map(b => `<tr>
    <td>${esc(b.email)}</td><td>${esc(b.reason||"")}</td><td>${esc(fmtDate(b.created_at))}</td>
    <td><button class="btn" data-unblock="${esc(b.email)}">Unblock</button></td></tr>`).join("")
    : `<tr><td class="empty">No blocked emails.</td></tr>`;
}
$("blockedRows").addEventListener("click", async e => {
  const b = e.target.closest("[data-unblock]"); if(!b) return;
  if(!confirm(`Allow ${b.dataset.unblock} to attempt again?`)) return;
  b.disabled = true;
  await fetch(`${SUPABASE_URL}/rest/v1/blocked_emails?email=eq.${encodeURIComponent(b.dataset.unblock)}`, {
    method:"DELETE", headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${token}`}
  });
  loadBlocked();
});
async function showApp(){
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  await load();
}

/* ---------- render ---------- */
function filtered(){
  const q = $("search").value.trim().toLowerCase(), t = $("testFilter").value, p = $("passFilter").value;
  return data.filter(d => {
    if(t && d.test !== t) return false;
    if(p==="pass" && !isPass(d)) return false;
    if(p==="fail" && (isPass(d) || d.flagged)) return false;
    if(p==="flagged" && !d.flagged) return false;
    if(q && !`${d.candidate_name} ${d.candidate_email} ${d.candidate_id}`.toLowerCase().includes(q)) return false;
    return true;
  });
}
const isPass = d => !d.flagged && (d.passed === true || (d.passed == null && d.score >= 60));

const QUESTION_BANKS = {
  aptitude: [
    { options: ["20%","25%","30%","33%"], answer: 1 },
    { options: ["$7,200","$7,460","$7,560","$8,100"], answer: 2 },
    { options: ["1,200","1,500","1,800","2,000"], answer: 1 },
    { options: ["True","False","Cannot Say"], answer: 1 },
    { options: ["True","False","Cannot Say"], answer: 2 },
    { options: ["True","False","Cannot Say"], answer: 0 },
    { options: ["36","40","42","44"], answer: 2 },
    { options: ["162","216","243","324"], answer: 2 },
    { options: ["All Lazzies are Bloops","All Bloops are Lazzies","Some Lazzies are not Razzies","No Bloops are Lazzies"], answer: 1 },
    { options: ["Say nothing — it isn't your report.","Quietly fix it yourself without telling them.","Privately flag it to the colleague so they can correct it before sending.","Raise the mistake in the next team meeting."], answer: 2 },
    { options: ["Accept it and hope it works out.","Raise your concerns with your manager and propose a revised timeline or priorities.","Miss the deadline and explain afterwards.","Vent to colleagues about the pressure."], answer: 1 },
    { options: ["Quietly do their share to keep the project moving.","Report them to management straight away.","Speak with them directly to understand the issue and agree next steps.","Ignore it and focus only on your own work."], answer: 2 }
  ],
  bluecascade: [
    { q: "A jacket costs $80", opts: ["$96","$100","$64","$120"], ans: 1 },
    { q: "What is 15% of 240", opts: ["24","30","36","48"], ans: 2 },
    { q: "A train travels 240 km", ans: "80 km/h" },
    { q: "Two amounts are split in the ratio 3 : 5", opts: ["24","32","40","48"], ans: 2 },
    { q: "Find the next number in the series", ans: "42" },
    { q: "What is the average of 10, 20, 30", opts: ["25","30","35","40"], ans: 1 },
    { q: "Five tasks each take 2 days", ans: "10 days" },
    { q: "All cats are animals", opts: ["All cats are pets","Some cats are pets","All pets are cats","None of these must be true"], ans: 3 },
    { q: "If it rains, the ground gets wet", ans: "False" },
    { q: "Which one does NOT belong", opts: ["Square","Circle","Triangle","Cube"], ans: 3 },
    { q: "Complete the pattern: AZ, BY, CX", opts: ["DV","DW","EW","CW"], ans: 1 },
    { q: "Select ALL of the prime numbers", opts: ["2","9","11","15","17"], ans: [0,2,4] },
    { q: "Pointing at a photo", opts: ["His mother","His sister","His daughter","His aunt"], ans: 1 },
    { q: "closest in meaning to “abundant”", opts: ["Scarce","Plentiful","Hollow","Rare"], ans: 1 },
    { q: "antonym of “transparent”", opts: ["Clear","Opaque","Visible","Sheer"], ans: 1 },
    { q: "Which word is spelled correctly", opts: ["Acommodate","Accomodate","Accommodate","Acomodate"], ans: 2 },
    { q: "Neither the players nor the coach", opts: ["were","was","are","have"], ans: 1 },
    { q: "“affect” is most often a verb", ans: "True" },
    { q: "You realize a project deadline is now at risk", opts: ["Keep working quietly","Tell your manager early and bring options","Wait until the deadline to explain","Ask a teammate to take the blame"], ans: 1 },
    { q: "team meeting more productive", opts: ["Share an agenda beforehand","Start on time","Let it run over with no limit","Assign clear action items"], ans: [0,1,3] },
    { q: "A customer is upset about a shipping delay", opts: ["Explain it is not your department","Acknowledge it, apologize, and give a clear next step","Offer no reply until it is resolved","Tell them delays are normal"], ans: 1 }
  ]
};

const GAME_TRAITS = {
  risk: { name: "Risk Management", icon: "🎲", section: "Risk Tolerance & Decisions" },
  memory: { name: "Working Memory", icon: "🧠", section: "Spatial Recall & Capacity" },
  pattern: { name: "Logical Reasoning", icon: "🧩", section: "Inductive & Pattern Logic" },
  emotion: { name: "Emotional Intelligence", icon: "❤️", section: "Empathy & Interpersonal" },
  number: { name: "Numerical Speed", icon: "🔢", section: "Quantitative Speed & Math" },
  boundaries: { name: "Professional Boundaries", icon: "🛡️", section: "Workplace Ethics & Limits" },
  culture: { name: "Maintaining Culture", icon: "🤝", section: "Culture & Team Alignment" },
  discipline: { name: "Discipline & Focus", icon: "⏱️", section: "Focus, Impulse & Timing" }
};
const GAME_TRAIT_ORDER = ["risk", "memory", "pattern", "emotion", "number", "boundaries", "culture", "discipline"];

function resolveAnswer(test, a, i) {
  let userText = "", correctText = "";
  const resp = a.response;

  if (test === "aptitude") {
    const qDef = QUESTION_BANKS.aptitude[i];
    if (qDef) {
      userText = (resp != null && qDef.options[resp] !== undefined)
        ? qDef.options[resp]
        : (resp != null ? String(resp) : "No answer");
      correctText = qDef.options[qDef.answer] !== undefined
        ? qDef.options[qDef.answer]
        : String(qDef.answer);
      return { userText, correctText };
    }
  }

  if (test === "bluecascade") {
    const qText = (a.question || "").toLowerCase();
    const qDef = QUESTION_BANKS.bluecascade.find(b => qText.includes(b.q.toLowerCase()));
    if (qDef) {
      if (qDef.opts) {
        if (Array.isArray(resp)) userText = resp.map(r => qDef.opts[r] || r).join(", ");
        else userText = (resp != null && qDef.opts[resp] !== undefined) ? qDef.opts[resp] : String(resp ?? "No answer");
        if (Array.isArray(qDef.ans)) correctText = qDef.ans.map(r => qDef.opts[r] || r).join(", ");
        else correctText = qDef.opts[qDef.ans] !== undefined ? qDef.opts[qDef.ans] : String(qDef.ans);
      } else {
        userText = String(resp ?? "No answer");
        correctText = String(qDef.ans);
      }
      return { userText, correctText };
    }
  }

  userText = resp != null ? (typeof resp === "object" ? JSON.stringify(resp) : String(resp)) : "No answer";
  correctText = a.correct ? userText : "—";
  return { userText, correctText };
}

function render(){
  const rows = filtered().sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    return (x==null?-1:y==null?1:x>y?1:x<y?-1:0)*sortDir;
  });
  const scored = rows.filter(d=>!d.flagged);
  const avg = scored.length ? Math.round(scored.reduce((s,d)=>s+(d.score||0),0)/scored.length) : 0;
  const passRate = scored.length ? Math.round(scored.filter(isPass).length/scored.length*100) : 0;
  const cnt = t => rows.filter(d=>d.test===t).length;
  $("stats").innerHTML = `
    <div class="stat"><b>${rows.length}</b><span>Submissions</span></div>
    <div class="stat"><b>${avg}%</b><span>Average score</span></div>
    <div class="stat"><b>${passRate}%</b><span>Pass rate (60%+)</span></div>
    <div class="stat"><b>${cnt("aptitude")} / ${cnt("bluecascade")} / ${cnt("games")}</b><span>Aptitude / BlueCascade / Games</span></div>
    <div class="stat"><b style="color:var(--bad)">${rows.filter(d=>d.flagged).length}</b><span>Flagged</span></div>`;

  const eligible = rows.filter(d=>d.candidate_email && d.score != null);
  const sendAllEl = $("sendAllBtn");
  if(sendAllEl && (!sendAllEl.disabled || sendAllEl.textContent.startsWith("Send Results to All"))){
    sendAllEl.textContent = `Send Results to All (${eligible.length})`;
  }

  if(!rows.length){ $("rows").innerHTML = `<tr><td colspan="9" class="empty">No submissions yet.</td></tr>`; return; }
  $("rows").innerHTML = rows.map(d => {
    const pass = isPass(d);
    let html = `<tr class="row" data-id="${esc(d.id)}">
      <td>${esc(fmtDate(d.created_at))}</td><td>${esc(d.candidate_name)}</td><td>${esc(d.candidate_email)}</td>
      <td><span class="pill">${esc(d.test)}</span></td>
      <td>${d.score==null?"—":`<b>${esc(d.score)}%</b>`} ${d.total!=null?`<small style="color:var(--muted)">${esc(d.points)}/${esc(d.total)}</small>`:""}</td>
      <td class="${pass?"pass":"fail"}">${d.flagged?"⚑ Flagged":pass?"Passed":"Not passed"}</td>
      <td>${d.tab_switches==null?"—":esc(d.tab_switches)}</td><td>${fmtDur(d.duration_sec)}</td>
      <td><button class="btn sm" data-send="${esc(d.id)}" style="background:var(--accent-weak);color:var(--accent);border-color:var(--accent);white-space:nowrap">Send Result</button></td></tr>`;
    if(open===d.id){
      let answersData = d.answers;
      if (typeof answersData === "string") {
        try { answersData = JSON.parse(answersData); } catch(e){}
      }
      const items = Array.isArray(answersData) ? answersData : [];
      let secs = (!Array.isArray(answersData) && answersData && typeof answersData === "object") ? Object.entries(answersData) : [];

      if (secs.length) {
        secs.sort(([a], [b]) => {
          const ia = GAME_TRAIT_ORDER.indexOf(a), ib = GAME_TRAIT_ORDER.indexOf(b);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });
      }

      let parts = [];
      if (items.length) {
        parts.push(`<div class="ans">${items.map((a,i)=>{
          const { userText, correctText } = resolveAnswer(d.test, a, i);
          return `<div class="a">
            <i class="${a.correct?"ok":"no"}">${a.correct?"✓":"✕"}</i>
            <div style="flex:1">
              <div>${i+1}. ${esc(a.question)} <small style="color:var(--muted)">[${esc(a.section)}]</small></div>
              <div style="margin-top:3px;font-size:.84rem">
                ${a.correct
                  ? `<span style="color:var(--good)"><b>Answer:</b> ${esc(userText)}</span>`
                  : `<span style="color:var(--bad);margin-right:16px"><b>User answer:</b> ${esc(userText)}</span>
                     <span style="color:var(--good)"><b>Correct answer:</b> ${esc(correctText)}</span>`
                }
              </div>
            </div>
          </div>`;
        }).join("")}</div>`);
      }
      if (secs.length) {
        parts.push(`<div class="ans" style="${items.length ? "margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);" : ""}">${secs.map(([k,v], i)=>{
          const tDef = GAME_TRAITS[k] || { name: k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, " "), icon: "🎮", section: "Game Module" };
          const num = Number(v) || 0;
          const passed = num >= 60;
          return `<div class="a">
            <i class="${passed ? "ok" : "no"}">${passed ? "✓" : "✕"}</i>
            <div style="flex:1">
              <div>${i+1}. ${tDef.icon} <b>${esc(tDef.name)}</b> <small style="color:var(--muted)">[${esc(tDef.section)}]</small></div>
              <div style="margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:.84rem">
                ${passed
                  ? `<span style="color:var(--good)"><b>Score:</b> ${num}% (Passed)</span>`
                  : `<span style="color:var(--bad)"><b>Score:</b> ${num}% (Needs Improvement)</span>
                     <span style="color:var(--muted)"><b>Benchmark:</b> 60%+</span>`
                }
                <div style="width:90px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;display:inline-block">
                  <div style="width:${Math.max(0, Math.min(100, num))}%;height:100%;background:${passed ? "var(--good)" : "var(--bad)"};border-radius:99px"></div>
                </div>
              </div>
            </div>
          </div>`;
        }).join("")}</div>`);
      }

      const detailContent = parts.join("") || `<div class="ans"><small>No answer detail.</small></div>`;

      html += `<tr class="detail"><td colspan="9">
        <small>ID: ${esc(d.candidate_id||"—")} · Invite code: ${esc(d.invite_code||"—")} · Full-screen exits: ${esc(d.fullscreen_exits ?? 0)}${d.flagged?" · Ended early: exited full screen twice":""}</small>
        ${detailContent}
      </td></tr>`;
    }
    return html;
  }).join("");
}

$("rows").addEventListener("click", e => {
  const sendBtn = e.target.closest("[data-send]");
  if (sendBtn) {
    const sub = data.find(x => x.id === sendBtn.dataset.send);
    if (sub) sendSingleResult(sub, sendBtn);
    return;
  }
  const tr = e.target.closest("tr.row"); if(!tr) return;
  open = open === tr.dataset.id ? null : tr.dataset.id; render();
});
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = sortKey===k ? -sortDir : -1; sortKey = k; render();
});
["search","testFilter","passFilter"].forEach(id => $(id).addEventListener("input", render));
$("refreshBtn").onclick = load;

/* ---------- CSV ---------- */
$("csvBtn").onclick = () => {
  const cols = ["created_at","test","candidate_id","candidate_name","candidate_email","invite_code","score","points","total","passed","flagged","fullscreen_exits","tab_switches","duration_sec"];
  // prefix cells that start with a formula character so spreadsheets don't execute them
  const cell = v => { let s = v==null ? "" : String(v); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; };
  const csv = [cols.join(",")].concat(filtered().map(d => cols.map(c => cell(d[c])).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "submissions.csv"; a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- email sending ---------- */
const MAILER_API = window.MAILER_API_URL || (location.protocol === "https:" ? "/api" : "http://localhost:3000/api");

async function sendSingleResult(sub, btn) {
  if (!sub.candidate_email) return alert("This candidate has no email address.");
  if (!confirm(`Send assessment result email to ${sub.candidate_email}?`)) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(`${MAILER_API}/send-result`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ submission: sub })
    });
    const res = await r.json();
    if (!r.ok) throw new Error(res.error || "Sending failed");
    btn.textContent = "Sent ✓";
    btn.style.color = "var(--good)";
    btn.style.borderColor = "var(--good)";
  } catch (err) {
    alert(`Could not send result: ${err.message}\n(Make sure 'node send_result.js' is running)`);
    btn.disabled = false; btn.textContent = orig;
  }
}

async function sendAllResults() {
  const list = filtered().filter(d => d.candidate_email && d.score != null);
  if (!list.length) return alert("No scored submissions with email addresses found.");
  if (!confirm(`Send results to all ${list.length} candidate(s)?`)) return;

  const btn = $("sendAllBtn");
  const orig = btn.textContent;
  btn.disabled = true;
  let sent = 0;

  for (let i = 0; i < list.length; i++) {
    btn.textContent = `Sending (${i + 1}/${list.length})…`;
    try {
      const r = await fetch(`${MAILER_API}/send-result`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ submission: list[i] })
      });
      if (r.ok) sent++;
    } catch (e) {
      console.error(e);
    }
  }

  btn.textContent = `Sent (${sent}/${list.length}) ✓`;
  setTimeout(() => {
    btn.disabled = false;
    const currentCount = filtered().filter(d=>d.candidate_email && d.score != null).length;
    btn.textContent = `Send Results to All (${currentCount})`;
  }, 4000);
}

$("sendAllBtn").onclick = sendAllResults;

if(token) showApp();
</script>
